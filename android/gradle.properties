org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compilación incremental de Kotlin apagada.
#
# firebase_core todavía aplica su propio plugin de Kotlin, y Flutter 3.44 trae
# Kotlin incorporado. Los dos registran las mismas cachés incrementales y el
# build falla con «Could not close incremental caches». Sin incremental cada
# compilación tarda un poco más, pero termina.
#
# Se puede quitar cuando firebase_core migre a Built-in Kotlin (el propio build
# avisa de eso en un WARNING).
kotlin.incremental=false
